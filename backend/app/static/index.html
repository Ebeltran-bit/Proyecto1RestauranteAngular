<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedidos de sala</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BD%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <button id="back" class="back" type="button" hidden>&larr; Volver</button>
    <h1 id="title">Mesas</h1>
    <a class="docs-link" href="/docs" target="_blank" rel="noopener">API</a>
  </header>

  <div id="message" class="message" role="alert" hidden></div>

  <main>
    <!-- 1. Elegir mesa -->
    <section id="view-tables" class="view">
      <p class="hint">Elige una mesa para ver sus pedidos.</p>
      <div id="tables" class="grid"></div>
    </section>

    <!-- 2. Pedidos de la mesa -->
    <section id="view-orders" class="view" hidden>
      <ul id="orders" class="list"></ul>
      <p id="no-orders" class="hint" hidden>Esta mesa no tiene pedidos.</p>
      <button id="add-order" class="primary wide" type="button">+ Añadir pedido</button>
    </section>

    <!-- 3. Añadir pedido: categoría, producto, presentación y cantidad -->
    <section id="view-new" class="view" hidden>
      <h2>Categoría</h2>
      <div id="categories" class="chips"></div>
      <h2>Producto</h2>
      <div id="products" class="grid"></div>
      <form id="new-form" class="form" hidden>
        <h2>Presentación</h2>
        <div id="new-presentations" class="chips"></div>
        <h2>Cantidad</h2>
        <div class="stepper" data-target="new-quantity">
          <button type="button" data-step="-1" aria-label="Menos">&minus;</button>
          <input id="new-quantity" type="number" min="1" max="99" value="1" required>
          <button type="button" data-step="1" aria-label="Más">+</button>
        </div>
        <button class="primary wide" type="submit">Añadir a la mesa</button>
      </form>
    </section>

    <!-- 4. Modificar pedido -->
    <section id="view-edit" class="view" hidden>
      <form id="edit-form" class="form">
        <p id="edit-product" class="product-name"></p>
        <h2>Presentación</h2>
        <div id="edit-presentations" class="chips"></div>
        <h2>Cantidad</h2>
        <div class="stepper" data-target="edit-quantity">
          <button type="button" data-step="-1" aria-label="Menos">&minus;</button>
          <input id="edit-quantity" type="number" min="1" max="99" required>
          <button type="button" data-step="1" aria-label="Más">+</button>
        </div>
        <button class="primary wide" type="submit">Guardar cambios</button>
      </form>
    </section>
  </main>
</body>
</html>
